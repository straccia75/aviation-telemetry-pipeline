version: 2

models:
  - name: gold_dim_aircraft
    description: One row per aircraft with its latest attributes.
    columns:
      - name: flight_id
        tests:
          - unique
          - not_null

  - name: gold_daily_flight_metrics
    description: Daily metrics per aircraft.
    columns:
      - name: flight_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_dim_aircraft')
              field: flight_id

  - name: gold_anomalous_flights
    description: Aircraft-days above 380 m/s or 16,000 m, split into sustained readings and isolated spikes.
    tests:
      - unique:
          column_name: "CONCAT(flight_id, '|', CAST(ingestion_date AS STRING))"
    columns:
      - name: flight_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_dim_aircraft')
              field: flight_id
      - name: anomaly_reason
        tests:
          - accepted_values:
              values:
                - 'Sustained high speed and altitude'
                - 'Sustained high speed'
                - 'Sustained high altitude'
                - 'Isolated spike'
