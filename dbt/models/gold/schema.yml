version: 2

models:
  - name: gold_dim_aircraft
    description: One row per aircraft with its latest attributes.
    columns:
      - name: flight_id
        tests:
          - unique
          - not_null

  - name: gold_daily_flight_metrics
    description: Daily metrics per aircraft.
    columns:
      - name: flight_id
        tests:
          - not_null
          - relationships:
              to: ref('gold_dim_aircraft')
              field: flight_id

  - name: gold_anomalous_flights
    description: Aircraft above commercial speed or altitude limits.
    columns:
      - name: flight_id
        tests:
          - unique
          - not_null
      - name: anomaly_reason
        tests:
          - accepted_values:
              values:
                - 'Above commercial speed and altitude'
                - 'Above commercial speed'
                - 'Above commercial altitude'
                - 'Possible sensor noise'
